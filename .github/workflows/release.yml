name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v6.5.3)'
        required: true
      dist_tag:
        description: 'npm dist-tag'
        type: choice
        default: 'latest'
        options:
          - latest
          - beta
          - alpha
          - hotfix

jobs:
  publish:
    runs-on: ubuntu-latest

    # Requires a GitHub Environment named 'npm-publish' to be created in repository Settings.
    # Recommended: add required reviewers to this environment for an approval gate.
    environment: npm-publish

    permissions:
      id-token: write  # Required for npm Trusted Publishers (OIDC)
      contents: read   # Required for actions/checkout

    steps:
      - name: Resolve ref
        id: ref
        # On workflow_dispatch: use the provided tag input.
        # On tag push: use the pushed tag (github.ref).
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 0 # Required for lerna publish from-git to read tags

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do NOT set registry-url: setup-node@v6 would inject GITHUB_TOKEN as NODE_AUTH_TOKEN,
          # which npm would use instead of OIDC, breaking Trusted Publishers authentication.

      - name: Upgrade npm
        # Trusted Publishers require npm >= 11.5.1; stay on npm 11.x (not 12) for stability.
        run: npm install -g npm@^11

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Debug npm auth
        run: |
          echo "npm version: $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes (non-empty):-no (empty or unset)}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo ".npmrc contents (tokens redacted):"
          sed 's/_authToken=.*//' ~/.npmrc 2>/dev/null || echo "(no .npmrc)"

      - name: Publish
        # lerna publish from-git cannot be used here: lerna 5.6.2 bundles libnpmpublish from 2022
        # which does not support OIDC/Trusted Publishers. lerna exec delegates to the global
        # npm 11.x, which properly exchanges the GitHub OIDC token for a publish token.
        #
        # npm 11 ignores publishConfig.directory when called directly, so we cd into build/
        # explicitly when build/package.json exists (all compiled packages). Packages without
        # a build step (e.g. cra-template-uui) publish from their root as before.
        run: |
          npx lerna exec --sort --stream \
            --ignore=@epam/app --ignore=@epam/uui-e2e-tests \
            -- bash -c '[ -f build/package.json ] && cd build; npm publish --provenance --access public --tag "$DIST_TAG" --ignore-scripts'
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
          NPM_CONFIG_LOGLEVEL: 'verbose'
